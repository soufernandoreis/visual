  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    // ======== CONFIGURAÇÃO BÁSICA DO THREE.JS ========
    const canvas = document.getElementById("bg-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x050509, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050509, 0.35);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.z = 4;

    // ======== SHADERS (GLSL) – VERSÃO ESTÁVEL COM AJUSTES SUAVES ========
    const vertexShader = `
      uniform float uTime;
      uniform float uNoiseAmp;
      uniform float uMouseStrength;
      uniform vec2  uMouse;
      varying float vNoise;

      float hash(vec3 p) {
        return sin(dot(p, vec3(17.1, 31.7, 11.3)) + uTime * 0.6);
      }

      void main() {
        vec3 pos = position;

        float n = hash(normal * 3.0 + pos * 2.0);
        n = 0.5 + 0.5 * n; // 0..1

        // “respiração” um pouco mais forte via uNoiseAmp
        float breathing = 0.5 + 0.5 * sin(uTime * 0.7);
        float displacement = (n * 0.7 + breathing * 0.3) * uNoiseAmp;

        // influência do mouse (uMouse em -1..1)
        vec3 mouseDir = normalize(vec3(uMouse, 1.0));
        float mouseEffect = dot(normalize(pos), mouseDir);
        displacement += mouseEffect * uMouseStrength;

        vec3 newPos = pos + normal * displacement;

        vNoise = n;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        gl_PointSize = 2.2; // mantido
      }
    `;

    const fragmentShader = `
      varying float vNoise;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;

        // Paleta um pouco mais profunda
        vec3 colorCore = vec3(0.03, 0.08, 0.16);   // bem escuro
        vec3 colorEdge = vec3(0.68, 0.92, 1.00);   // ciano claro
        vec3 colorGlow = vec3(1.00, 1.00, 1.00);   // highlight

        float glow = smoothstep(0.0, 0.4, vNoise);

        vec3 color = mix(colorCore, colorEdge, vNoise);
        color = mix(color, colorGlow, glow * 0.35);

        float alpha = 1.0 - smoothstep(0.3, 0.5, d);
        alpha *= 0.95;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    // ======== GEOMETRIA + MATERIAL ========
    // AQUI aumentamos a DENSIDADE (mais segmentos), mantendo o mesmo tamanho
    const geometry = new THREE.SphereGeometry(1.4, 260, 260);

    const uniforms = {
      uTime:          { value: 0 },
      uNoiseAmp:      { value: 1.1 },  // antes 0.9 → pulso/orgânico um pouco mais forte
      uMouseStrength: { value: 0.6 },  // resposta um pouco mais sensível ao mouse
      uMouse:         { value: new THREE.Vector2(0.0, 0.0) }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // ======== INTERAÇÃO COM O CURSOR ========
    const mouse = new THREE.Vector2(0, 0);

    window.addEventListener("mousemove", (event) => {
      const x = (event.clientX / window.innerWidth) * 2 - 1;
      const y = (event.clientY / window.innerHeight) * 2 - 1;
      mouse.set(x, -y);
      uniforms.uMouse.value.lerp(mouse, 0.1);
    });

    // ======== RESPONSIVIDADE ========
    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", onResize);
    onResize();

    // ======== LOOP DE ANIMAÇÃO ========
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      uniforms.uTime.value = elapsed;

      // movimento um pouco mais vivo
      points.rotation.y += 0.0032;
      points.rotation.x = Math.sin(elapsed * 0.18) * 0.14;

      renderer.render(scene, camera);
    }

    animate();
  </script>
