<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Artificial para Negócios</title>
    <!-- Estilos CSS básicos para o canvas e os textos H1/H2 -->
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050509; /* Cor de fundo para combinar com o Three.js */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fonte mais moderna */
            color: white; /* Cor padrão do texto */
            display: flex; /* Para centralizar o conteúdo verticalmente */
            flex-direction: column;
            justify-content: center; /* Centraliza verticalmente */
            align-items: center; /* Centraliza horizontalmente */
            min-height: 100vh; /* Garante que o body ocupe a altura total da viewport */
            position: relative; /* Necessário para posicionar o canvas e o conteúdo */
        }
        #bg-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed; /* Fixa o canvas na tela para que outros elementos possam ficar por cima */
            top: 0;
            left: 0;
            z-index: -1; /* Coloca o canvas atrás de outros conteúdos do body */
        }

        /* Estilos para o H1 */
        h1 {
            text-align: center;
            font-size: 2.8em; /* Tamanho ajustado para caber a frase */
            color: #E0FFFF; /* Um ciano claro, combinando com a esfera */
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.7); /* Sombra para um efeito de brilho mais forte */
            margin-bottom: 10px; /* Espaço entre H1 e H2 */
            line-height: 1.2; /* Espaçamento entre linhas */
            max-width: 80%; /* Limita a largura para que o texto não se estique muito em telas grandes */
            z-index: 1; /* Garante que o H1 esteja acima do canvas */
        }

        /* Estilos para o H2 */
        h2 {
            text-align: center;
            font-size: 1.5em; /* Tamanho para o subtítulo */
            color: #B0E0E6; /* Cor ligeiramente mais escura que o H1 */
            text-shadow: 0 0 8px rgba(176, 224, 230, 0.6); /* Sombra suave */
            margin-top: 0; /* Remove margem superior padrão do h2 */
            max-width: 70%;
            z-index: 1; /* Garante que o H2 esteja acima do canvas */
        }

        /* Estilo para a mensagem de erro se o canvas não for encontrado */
        #error-message {
            color: white;
            text-align: center;
            margin-top: 50px;
            font-size: 1.2em;
            z-index: 10; /* Garante que a mensagem de erro esteja acima de tudo */
            position: absolute; /* Para que possa ser posicionado independentemente */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <!-- Seus títulos H1 e H2 -->
    <h1>Organize os processos que fazem o seu negócio escalar</h1>
    <h2>Inteligência artificial para negócios no Digital</h2>

    <!-- O elemento canvas onde o Three.js renderizará a cena -->
    <canvas id="bg-canvas"></canvas>

    <!-- Um div para exibir mensagens de erro se o canvas não for encontrado -->
    <div id="error-message"></div>

    <!-- Importa a biblioteca Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <!-- Seu código JavaScript -->
    <script>
        // ======== CONFIGURAÇÃO BÁSICA DO THREE.JS ========
        const canvas = document.getElementById("bg-canvas");
        const errorMessageDiv = document.getElementById("error-message");

        if (!canvas) {
            console.error("Erro: Elemento canvas com ID 'bg-canvas' não encontrado!");
            errorMessageDiv.innerHTML = "<p>Ops! O canvas não foi encontrado. Verifique seu HTML.</p>";
            throw new Error("Canvas element not found.");
        }

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x050509, 1);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050509, 0.35);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.z = 4;

        // ======== SHADERS (GLSL) – VERSÃO ESTÁVEL COM AJUSTES SUAVES ========
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseAmp;
            uniform float uMouseStrength;
            uniform vec2  uMouse;
            varying float vNoise;

            float hash(vec3 p) {
                return sin(dot(p, vec3(17.1, 31.7, 11.3)) + uTime * 0.6);
            }

            void main() {
                vec3 pos = position;

                float n = hash(normal * 3.0 + pos * 2.0);
                n = 0.5 + 0.5 * n;

                float breathing = 0.5 + 0.5 * sin(uTime * 0.7);
                float displacement = (n * 0.7 + breathing * 0.3) * uNoiseAmp;

                vec3 mouseDir = normalize(vec3(uMouse, 1.0));
                float mouseEffect = dot(normalize(pos), mouseDir);
                displacement += mouseEffect * uMouseStrength;

                vec3 newPos = pos + normal * displacement;

                vNoise = n;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                gl_PointSize = 2.2;
            }
        `;

        const fragmentShader = `
            varying float vNoise;

            void main() {
                float d = length(gl_PointCoord - 0.5);
                if (d > 0.5) discard;

                vec3 colorCore = vec3(0.03, 0.08, 0.16);
                vec3 colorEdge = vec3(0.68, 0.92, 1.00);
                vec3 colorGlow = vec3(1.00, 1.00, 1.00);

                float glow = smoothstep(0.0, 0.4, vNoise);

                vec3 color = mix(colorCore, colorEdge, vNoise);
                color = mix(color, colorGlow, glow * 0.35);

                float alpha = 1.0 - smoothstep(0.3, 0.5, d);
                alpha *= 0.95;

                gl_FragColor = vec4(color, alpha);
            }
        `;

        // ======== GEOMETRIA + MATERIAL ========
        // Tamanho da esfera alterado para 0.5
        const geometry = new THREE.SphereGeometry(0.5, 260, 260); // Raio alterado de 1.4 para 0.5

        const uniforms = {
            uTime:          { value: 0 },
            uNoiseAmp:      { value: 1.1 },
            uMouseStrength: { value: 0.6 },
            uMouse:         { value: new THREE.Vector2(0.0, 0.0) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ======== INTERAÇÃO COM O CURSOR ========
        const mouse = new THREE.Vector2(0, 0);
        const targetMouse = new THREE.Vector2(0, 0);

        window.addEventListener("mousemove", (event) => {
            targetMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // ======== RESPONSIVIDADE ========
        function onResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", onResize);
        onResize();

        // ======== LOOP DE ANIMAÇÃO ========
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            uniforms.uTime.value = elapsed;

            uniforms.uMouse.value.lerp(targetMouse, 0.1);

            points.rotation.y += 0.0032;
            points.rotation.x = Math.sin(elapsed * 0.18) * 0.14;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
