  <!-- Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    // ======== CONFIGURAÇÃO BÁSICA DO THREE.JS ========
    const canvas = document.getElementById("bg-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x050509, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050509, 0.35);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.z = 4;

    // ======== SHADERS (GLSL) – VERSÃO TURBINADA ========

    const vertexShader = `
      uniform float uTime;
      uniform float uNoiseAmp;
      uniform float uMouseStrength;
      uniform float uPulseIntensity;
      uniform float uMagFieldStrength;
      uniform vec2  uMouse;
      varying float vNoise;
      varying float vField;

      // ruído simples baseado em seno
      float hash(vec3 p) {
        return sin(dot(p, vec3(17.1, 31.7, 11.3)) + uTime * 0.6);
      }

      void main() {
        vec3 pos = position;

        // ruído em duas camadas para ficar mais orgânico
        float n1 = hash(normal * 3.0 + pos * 2.0);
        float n2 = hash(normal * 7.0 + pos * 5.0 + vec3(uTime * 0.4));
        float n  = 0.6 * n1 + 0.4 * n2;
        n = 0.5 + 0.5 * n; // 0..1

        // "pulso" de respiração mais forte
        float breathing = 0.5 + 0.5 * sin(uTime * 0.9);
        float displacement = (n * 0.7 + breathing * uPulseIntensity) * uNoiseAmp;

        // "campos magnéticos": padrões ao redor do eixo Y
        float angle = atan(pos.z, pos.x); // ângulo em torno do eixo Y
        float field = sin(angle * 4.0 + uTime * 1.4) * cos(pos.y * 3.0 + uTime * 0.7);
        displacement += field * uMagFieldStrength;

        // fluxo tangencial para dar sensação de linhas de campo
        vec3 tangent = normalize(vec3(-sin(angle), 0.0, cos(angle)));
        pos += tangent * field * 0.05;

        // influência do mouse (uMouse em -1..1)
        vec3 mouseDir = normalize(vec3(uMouse, 1.0));
        float mouseEffect = dot(normalize(position), mouseDir);
        displacement += mouseEffect * uMouseStrength;

        vec3 newPos = position + normal * displacement;

        vNoise = n;
        vField = field;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
        gl_PointSize = 2.2; // tamanho mantido, como você pediu
      }
    `;

    const fragmentShader = `
      varying float vNoise;
      varying float vField;

      void main() {
        // suaviza o ponto para ficar mais orgânico
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;

        // paleta mais próxima do vídeo: núcleo escuro, bordas frias, highlight branco
        vec3 colorCore = vec3(0.03, 0.09, 0.16);   // azul bem escuro
        vec3 colorEdge = vec3(0.70, 0.92, 1.00);   // ciano claro
        vec3 colorHot  = vec3(1.00, 1.00, 1.00);   // highlight branco

        // campos magnéticos influenciando a energia
        float fieldGlow = 0.5 + 0.5 * vField;
        float energy = smoothstep(0.15, 0.95, vNoise + fieldGlow * 0.4);

        vec3 color = mix(colorCore, colorEdge, energy);
        color = mix(color, colorHot, energy * 0.35);

        float alpha = 1.0 - smoothstep(0.3, 0.5, d);
        alpha *= 0.95;

        gl_FragColor = vec4(color, alpha);
      }
    `;

    // ======== GEOMETRIA + MATERIAL ========
    // Mais densidade: mais segmentos na esfera
    const geometry = new THREE.SphereGeometry(1.4, 260, 260);

    const uniforms = {
      uTime:            { value: 0 },
      uNoiseAmp:        { value: 1.05 },   // amplitude da deformação
      uMouseStrength:   { value: 0.65 },   // influência do mouse
      uPulseIntensity:  { value: 0.55 },   // força do "pulso"
      uMagFieldStrength:{ value: 0.40 },   // força dos campos magnéticos
      uMouse:           { value: new THREE.Vector2(0.0, 0.0) }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // ======== INTERAÇÃO COM O CURSOR ========
    const mouse = new THREE.Vector2(0, 0);

    window.addEventListener("mousemove", (event) => {
      const x = (event.clientX / window.innerWidth) * 2 - 1;
      const y = (event.clientY / window.innerHeight) * 2 - 1;
      mouse.set(x, -y); // inverte Y

      uniforms.uMouse.value.lerp(mouse, 0.12); // movimento mais suave
    });

    // ======== RESPONSIVIDADE ========
    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", onResize);
    onResize();

    // ======== LOOP DE ANIMAÇÃO ========
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      uniforms.uTime.value = elapsed;

      // rotação + "vida"
      points.rotation.y += 0.0035;
      points.rotation.x = Math.sin(elapsed * 0.18) * 0.16;

      renderer.render(scene, camera);
    }

    animate();
  </script>
