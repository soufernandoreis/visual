<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligência Artificial para Negócios</title>
    <!-- Estilos CSS para layout, canvas e textos -->
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050509; /* Cor de fundo */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex; /* Habilita flexbox para layout */
            justify-content: space-between; /* Espaça o conteúdo principal e a esfera */
            align-items: center; /* Centraliza verticalmente os itens flex */
            min-height: 100vh; /* Garante que o body ocupe a altura total */
            padding: 0 5vw; /* Adiciona algum padding lateral para o conteúdo não colar nas bordas */
            position: relative;
        }

        #bg-canvas {
            display: block;
            width: 50vw; /* Canvas ocupa 50% da largura da viewport */
            height: 100vh;
            position: fixed; /* Fixa o canvas */
            top: 0;
            right: 0; /* Alinha o canvas à direita */
            z-index: -1;
        }

        /* Container para os textos H1 e H2 */
        .main-content {
            flex: 1; /* Ocupa o espaço disponível */
            max-width: 45vw; /* Limita a largura do conteúdo principal */
            z-index: 1; /* Garante que esteja acima do canvas */
            text-align: left; /* Alinha o texto à esquerda */
        }

        h1 {
            font-size: 2.8em;
            color: #FFFFF0; /* Amarelo muito claro, quase branco */
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.7); /* Sombra amarela */
            margin-bottom: 10px;
            line-height: 1.2;
            margin-top: 0; /* Remove margem superior padrão */
        }

        h2 {
            font-size: 1.5em;
            color: #FFD700; /* Dourado/Amarelo */
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            margin-top: 0;
        }

        /* Estilo para a mensagem de erro */
        #error-message {
            color: white;
            text-align: center;
            font-size: 1.2em;
            z-index: 10;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>Organize os processos que fazem o seu negócio escalar</h1>
        <h2>Inteligência artificial para negócios no Digital</h2>
    </div>

    <!-- O elemento canvas, agora posicionado à direita -->
    <canvas id="bg-canvas"></canvas>

    <div id="error-message"></div>

    <!-- Importa a biblioteca Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <!-- Seu código JavaScript -->
    <script>
        // ======== CONFIGURAÇÃO BÁSICA DO THREE.JS ========
        const canvas = document.getElementById("bg-canvas");
        const errorMessageDiv = document.getElementById("error-message");

        if (!canvas) {
            console.error("Erro: Elemento canvas com ID 'bg-canvas' não encontrado!");
            errorMessageDiv.innerHTML = "<p>Ops! O canvas não foi encontrado. Verifique seu HTML.</p>";
            throw new Error("Canvas element not found.");
        }

        // Three.js renderer deve ser criado com o canvas real, não um placeholder
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x050509, 1);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050509, 0.35);

        const camera = new THREE.PerspectiveCamera(
            45,
            canvas.clientWidth / canvas.clientHeight, // Usar o tamanho do canvas para o aspect ratio
            0.1,
            100
        );
        camera.position.z = 4;

        // ======== SHADERS (GLSL) – VERSÃO ESTÁVEL COM AJUSTES SUAVES ========
        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseAmp;
            uniform float uMouseStrength;
            uniform vec2  uMouse;
            varying float vNoise;

            float hash(vec3 p) {
                return sin(dot(p, vec3(17.1, 31.7, 11.3)) + uTime * 0.6);
            }

            void main() {
                vec3 pos = position;

                float n = hash(normal * 3.0 + pos * 2.0);
                n = 0.5 + 0.5 * n;

                float breathing = 0.5 + 0.5 * sin(uTime * 0.7);
                float displacement = (n * 0.7 + breathing * 0.3) * uNoiseAmp;

                vec3 mouseDir = normalize(vec3(uMouse, 1.0));
                float mouseEffect = dot(normalize(pos), mouseDir);
                displacement += mouseEffect * uMouseStrength;

                vec3 newPos = pos + normal * displacement;

                vNoise = n;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                gl_PointSize = 2.2;
            }
        `;

        const fragmentShader = `
            varying float vNoise;

            void main() {
                float d = length(gl_PointCoord - 0.5);
                if (d > 0.5) discard;

                // Paleta de cores amarelas e brancas
                vec3 colorCore = vec3(0.1, 0.08, 0.03);   // Base escura amarelada
                vec3 colorEdge = vec3(1.0, 0.9, 0.6);    // Amarelo claro
                vec3 colorGlow = vec3(1.0, 1.0, 1.0);    // Branco puro para o highlight

                float glow = smoothstep(0.0, 0.4, vNoise);

                vec3 color = mix(colorCore, colorEdge, vNoise);
                color = mix(color, colorGlow, glow * 0.35);

                float alpha = 1.0 - smoothstep(0.3, 0.5, d);
                alpha *= 0.95;

                gl_FragColor = vec4(color, alpha);
            }
        `;

        // ======== GEOMETRIA + MATERIAL ========
        const geometry = new THREE.SphereGeometry(0.5, 260, 260);

        const uniforms = {
            uTime:          { value: 0 },
            uNoiseAmp:      { value: 1.1 },
            uMouseStrength: { value: 0.6 },
            uMouse:         { value: new THREE.Vector2(0.0, 0.0) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ======== INTERAÇÃO COM O CURSOR ========
        const mouse = new THREE.Vector2(0, 0);
        const targetMouse = new THREE.Vector2(0, 0);

        window.addEventListener("mousemove", (event) => {
            // As coordenadas do mouse agora precisam ser relativas ao canvas se ele não ocupar 100%
            const rect = canvas.getBoundingClientRect();
            targetMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            targetMouse.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
        });

        // ======== RESPONSIVIDADE ========
        function onResize() {
            const width = canvas.clientWidth; // Usar clientWidth/Height do canvas
            const height = canvas.clientHeight; // para pegar o tamanho renderizado
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        window.addEventListener("resize", onResize);
        onResize(); // Chama uma vez para configurar o tamanho inicial

        // ======== LOOP DE ANIMAÇÃO ========
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();
            uniforms.uTime.value = elapsed;

            uniforms.uMouse.value.lerp(targetMouse, 0.1);

            points.rotation.y += 0.0032;
            points.rotation.x = Math.sin(elapsed * 0.18) * 0.14;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
